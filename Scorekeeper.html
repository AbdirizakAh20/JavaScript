<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Scorekeeper.css">
    <title>Score Keeper</title>
</head>
<body>
    <div class="section">
        <div class="container">
            <img src="paddle.png" alt="Paddle" class="img">
            <h1 class="title">Score Keeper</h1>
            <span class="score" id="score">0 to 0</span>
            <p>Use the buttons below to keep score</p>

            <div>
                <span class="playing">Playing to</span>
                <select name="topscore" id="topscore">
                    <option value="5">5</option>
                    <option value="6">6</option>    
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>

            <div>
                <button class="button" id="first">+1 Player One</button>
                <button class="button" id="second">+1 Player Two</button>
                <button class="button" id="reset">Reset</button>
            </div>

        </div>
    </div>
  
    <script src="Scorekeeper.js"></script>
</body>
</html>
